<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Container Yard — Secure Yard &amp; Demurrage Management</title>
    <meta name="description" content="Container Yard runs gate-in, gate-out, demurrage collection, bookings and accounting for multi-yard container depots in one secure workspace." />
    <meta name="author" content="Container Yard" />
    <link rel="canonical" href="https://everest-container-terminal.hosamyaser92.workers.dev/" />

    <!-- Professional UI typeface -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <meta property="og:title" content="Container Yard — Secure Yard &amp; Demurrage Management" />
    <meta property="og:description" content="Run gate operations, demurrage and accounting for container depots in one secure workspace." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://everest-container-terminal.hosamyaser92.workers.dev/" />

    <meta name="twitter:card" content="summary" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Container Yard",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Container yard management for gate operations, demurrage, bookings and accounting."
      }
    </script>
    <!-- Loading state shown the moment the HTML arrives, until the app's
         JavaScript replaces #root. Colours follow the app's light and dark
         themes; AppLoading.tsx draws the same thing once React is running. -->
    <style>
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
              background: hsl(210 40% 98%); color: hsl(222 47% 11%); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .boot-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .boot-bar { width: 160px; height: 3px; border-radius: 3px; background: hsl(214 32% 91%); overflow: hidden; }
      .boot-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: hsl(221 83% 53%);
                         animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-color-scheme: dark) {
        .boot { background: hsl(222 30% 9%); color: hsl(210 20% 92%); }
        .boot-bar { background: hsl(217 33% 20%); }
        .boot-bar::after { background: hsl(217 91% 60%); }
      }
      @media (prefers-reduced-motion: reduce) { .boot-bar::after { animation: none; width: 100%; opacity: 0.6; } }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Container Yard">
        <span class="boot-name">Container Yard</span>
        <span class="boot-bar"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
